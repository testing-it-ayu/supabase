<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supabase Auth Demo</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-2xl">
    
    <!-- Header -->
    <h1 class="text-2xl font-bold text-slate-100 mb-1">Welcome</h1>
    <p class="text-sm text-slate-400 mb-6">Enter username & password to log in or create an account.</p>

    <!-- Error/Status Message Box -->
    <div id="message-box" class="hidden text-sm p-3 rounded-lg mb-4 border"></div>

    <!-- Login/Signup Form -->
    <form id="auth-form" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Username</label>
        <input 
          type="text" 
          id="username" 
          required 
          placeholder="johndoe"
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-indigo-500 transition-colors"
        />
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
        <input 
          type="password" 
          id="password" 
          required 
          placeholder="••••••••"
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-indigo-500 transition-colors"
        />
      </div>

      <button 
        type="submit" 
        id="submit-btn"
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg transition-colors flex items-center justify-center gap-2"
      >
        <span>Continue</span>
      </button>
    </form>

    <!-- Protected User Data Section -->
    <div id="data-section" class="hidden mt-6 pt-6 border-t border-slate-700 space-y-4">
      <div class="flex justify-between items-center">
        <div>
          <span class="text-xs text-slate-400 block">Logged in as</span>
          <span id="user-display" class="font-bold text-indigo-400"></span>
        </div>
        <button id="logout-btn" class="text-xs text-red-400 hover:underline">Log out</button>
      </div>

      <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Your Data (RLS Protected)</h3>
        <div id="notes-list" class="text-sm text-slate-300 space-y-2">Loading...</div>
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // 1. YOUR CREDENTIALS & TABLE CONFIG
    // ==========================================
    const SUPABASE_URL = "https://fikrouualswwigrptgha.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpa3JvdXVhbHN3d2lncnB0Z2hhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0NDgzNjgsImV4cCI6MjEwMDAyNDM2OH0.0-HB7sknxCiQWl72uz723zl2y9LMa7UaSSm3DqOmaL0"; 
    const SUPABASE_TABLE = "user_notes";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // DOM Elements
    const authForm = document.getElementById("auth-form");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submit-btn");
    const messageBox = document.getElementById("message-box");
    const dataSection = document.getElementById("data-section");
    const userDisplay = document.getElementById("user-display");
    const logoutBtn = document.getElementById("logout-btn");
    const notesList = document.getElementById("notes-list");

    const usernameToEmail = (username) => `${username.trim().toLowerCase()}@myapp.internal`;

    function showMessage(text, isError = false) {
      messageBox.textContent = text;
      messageBox.classList.remove("hidden");
      messageBox.className = isError 
        ? "text-sm p-3 rounded-lg mb-4 border bg-red-950/50 text-red-300 border-red-800" 
        : "text-sm p-3 rounded-lg mb-4 border bg-emerald-950/50 text-emerald-300 border-emerald-800";
    }

    // Check for existing active session on page load
    async function checkExistingSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        const username = session.user.user_metadata?.username || session.user.email.split('@')[0];
        onAuthSuccess(session.user, username);
      }
    }
    checkExistingSession();

    // ==========================================
    // 2. AUTH LOGIC (LOGIN / AUTO-CREATE)
    // ==========================================
    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const username = usernameInput.value;
      const password = passwordInput.value;
      const email = usernameToEmail(username);

      submitBtn.disabled = true;
      submitBtn.innerText = "Processing...";
      messageBox.classList.add("hidden");

      try {
        // Step 1: Try signing in first
        const { data: signInData, error: signInError } = await supabase.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (!signInError && signInData.user) {
          showMessage("Welcome back!");
          onAuthSuccess(signInData.user, username);
          return;
        }

        // Step 2: Handle sign-in failure
        if (signInError.message.includes("Invalid login credentials")) {
          // Attempt sign-up for new user
          const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
            email: email,
            password: password,
            options: { data: { username: username } }
          });

          if (signUpError) {
            showMessage(signUpError.message, true);
            return;
          }

          // Case A: User existed, but password entered was wrong
          if (signUpData.user && signUpData.user.identities && signUpData.user.identities.length === 0) {
            showMessage("Incorrect password for existing username.", true);
            return;
          }

          // Case B: User created, but Supabase requires Email Confirmation
          if (signUpData.user && !signUpData.session) {
            showMessage("Account created! BUT 'Confirm Email' is ON in Supabase Dashboard. Disable it in Auth Settings to allow instant login.", true);
            return;
          }

          // Case C: Successfully created & logged in instantly
          if (signUpData.session) {
            showMessage("New account created and logged in!");
            onAuthSuccess(signUpData.user, username);
          }
        } else {
          showMessage(signInError.message, true);
        }

      } catch (err) {
        showMessage(err.message || "An unexpected error occurred.", true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Continue";
      }
    });

    // ==========================================
    // 3. FETCH & CREATE DATA WITH RLS
    // ==========================================
    async function onAuthSuccess(user, username) {
      userDisplay.textContent = username;
      dataSection.classList.remove("hidden");
      fetchUserNotes();
    }

    async function fetchUserNotes() {
      notesList.innerText = "Fetching your data...";

      const { data, error } = await supabase
        .from(SUPABASE_TABLE)
        .select("*");

      if (error) {
        notesList.innerHTML = `<span class="text-red-400">Database Error: ${error.message}</span>`;
      } else if (!data || data.length === 0) {
        notesList.innerText = "No data yet. Creating initial record...";
        createInitialData();
      } else {
        notesList.innerHTML = data.map(item => `
          <div class="p-2 bg-slate-800 rounded border border-slate-700 flex justify-between">
            <span>${item.content}</span>
            <span class="text-xs text-slate-500">${new Date(item.created_at).toLocaleTimeString()}</span>
          </div>
        `).join("");
      }
    }

    async function createInitialData() {
      const { error } = await supabase.from(SUPABASE_TABLE).insert([
        { content: "Welcome! This row was created automatically for your user." }
      ]);
      
      if (error) {
        notesList.innerHTML = `<span class="text-red-400">Error creating data: ${error.message}</span>`;
      } else {
        fetchUserNotes();
      }
    }

    // Log Out
    logoutBtn.addEventListener("click", async () => {
      await supabase.auth.signOut();
      dataSection.classList.add("hidden");
      messageBox.classList.add("hidden");
      usernameInput.value = "";
      passwordInput.value = "";
    });
  </script>
</body>
</html>
