<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Step by Step Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: sans-serif; padding: 20px; background: #111; color: #fff;">

  <h2>Supabase Step-by-Step Tester</h2>
  
  <div style="margin-bottom: 10px;">
    <input id="uname" placeholder="Username" style="padding: 8px;">
    <input id="pwd" type="password" placeholder="Password" style="padding: 8px;">
    <button onclick="testFlow()" style="padding: 8px 16px;">Test Login/Register</button>
  </div>

  <div id="output" style="background: #222; padding: 15px; border-radius: 5px; font-family: monospace; white-space: pre-wrap;">Awaiting action...</div>

  <script>
    const SUPABASE_URL = "https://fikrouualswwigrptgha.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpa3JvdXVhbHN3d2lncnB0Z2hhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0NDgzNjgsImV4cCI6MjEwMDAyNDM2OH0.0-HB7sknxCiQWl72uz723zl2y9LMa7UaSSm3DqOmaL0";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const log = (msg) => document.getElementById('output').innerText += "\n" + msg;

    async function testFlow() {
      document.getElementById('output').innerText = "Starting test...";
      const u = document.getElementById('uname').value.trim();
      const p = document.getElementById('pwd').value;
      const email = `${u.toLowerCase()}@myapp.internal`;

      if (!u || !p) return log("Error: Enter username and password.");

      // 1. Try Login
      log(`Attempting login for: ${email}`);
      let { data: loginData, error: loginError } = await supabase.auth.signInWithPassword({ email, password: p });

      if (loginError) {
        log(`Login failed (${loginError.message}). Attempting sign-up...`);
        
        // 2. Try Signup
        let { data: signUpData, error: signUpError } = await supabase.auth.signUp({ email, password: p });

        if (signUpError) {
          log(`SignUp Error: ${signUpError.message}`);
          return;
        }

        if (signUpData.user && signUpData.user.identities && signUpData.user.identities.length === 0) {
          log(`❌ ERROR: User already exists, but password was INCORRECT.`);
          return;
        }

        if (signUpData.user && !signUpData.session) {
          log(`⚠️ WARNING: Account created, but email confirmation is ON in Dashboard.`);
          return;
        }

        log(`✅ NEW USER CREATED & LOGGED IN! User ID: ${signUpData.user.id}`);
      } else {
        log(`✅ LOGGED IN SUCCESSFULLY! User ID: ${loginData.user.id}`);
      }

      // 3. Test Database Read/Write
      log("Testing database endpoint /rest/v1/user_notes...");
      
      // Try Insert
      const { error: insertErr } = await supabase.from('user_notes').insert([{ content: `Test note created at ${new Date().toLocaleTimeString()}` }]);
      if (insertErr) log(`Insert Error: ${insertErr.message}`);
      else log("✅ Successfully inserted row into user_notes");

      // Try Select
      const { data: notes, error: selectErr } = await supabase.from('user_notes').select('*');
      if (selectErr) log(`Select Error: ${selectErr.message}`);
      else log(`✅ Successfully fetched ${notes.length} note(s): ` + JSON.stringify(notes, null, 2));
    }
  </script>
</body>
</html>
